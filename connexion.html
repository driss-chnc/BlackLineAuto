<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - BlackLine Auto</title>

    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="top-header">

            <a href="index.html">
                <img src="images/logo.png" alt="BlackLine Auto">
            </a>

            <nav class="navigation">
                <ul>
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="vehicules.html">Véhicules</a></li>
                    <li><a href="sportives.html">Sportives</a></li>
                    <li><a href="electriques.html">Électriques</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>

            <div class="connexion">
                <a href="connexion.html">Connexion</a>
                <a href="inscription.html">Inscription</a>
            </div>

        </div>

    </header>


    <!-- CONNEXION -->

    <main class="auth-page">

        <div class="auth-box">

            <div class="auth-header">

                <span>BLACKLINE AUTO</span>

                <h1>Connexion</h1>

                <p>
                    Connectez-vous à votre espace personnel.
                </p>

            </div>


            <form id="login-form">

                <div class="form-group">

                    <label for="email">
                        Adresse email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="votre@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        required
                    >

                </div>


                <div class="forgot-password">

                    <a href="#">
                        Mot de passe oublié ?
                    </a>

                </div>


                <button type="submit" class="auth-btn">

                    SE CONNECTER

                    <span>→</span>

                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Vous n'avez pas encore de compte ?
                    <a href="inscription.html">
                        Créer un compte
                    </a>
                </p>

            </div>

        </div>

    </main>

</body>

</html>
