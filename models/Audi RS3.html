<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Audi Rs3 - BlackLine Auto</title>

    <link rel="icon" type="image/png" href="../images/logo.png">
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header>

        <div class="top-header">

            <img src="../images/logo.png" alt="Logo BlackLine Auto">

            <nav>
                <ul>
                    <li><a href="../index.html">Accueil</a></li>
                    <li><a href="../vehicules.html">Véhicules</a></li>
                    <li><a href="../super-cars.html">Super Cars</a></li>
                    <li><a href="../electriques.html">Électriques</a></li>
                    <li><a href="../services.html">Services</a></li>
                    <li><a href="../contact.html">Contact</a></li>
                </ul>
            </nav>

            <div class="connexion">
                <a href="../connexion.html">Connexion</a>
                <a href="../inscription.html">Inscription</a>
            </div>

        </div>

        <div class="slogan">
            <p>L'AUTOMOBILE, AUTREMENT</p>
        </div>

    </header>


    <main class="vehicle-page" data-car="Audi Rs3">

        <h1>Audi Rs3</h1>


        <!-- Galerie -->

        <div class="vehicle-gallery">

            <div class="gallery-main">
                <img
                    src="../images/Audi Rs3/rs3.png"
                    alt="Audi Rs3 vue générale"
                    class="gallery-clickable">
            </div>

            <div class="gallery-side">

                <div class="gallery-photo">
                    <img
                        src="../images/Audi Rs3/rs3 côté.png"
                        alt="Audi Rs3 vue de côté"
                        class="gallery-clickable">
                </div>

                <div class="gallery-photo">
                    <img
                        src="../images/Audi Rs3/rs3 arrière.png"
                        alt="Audi Rs3 vue arrière"
                        class="gallery-clickable">
                </div>

            </div>

        </div>


        <!-- Informations -->

        <div class="vehicle-content">

            <h2>70 000 €</h2>

            <div class="vehicle-info">

                <p>2025</p>
                <p>15 000 km</p>
                <p>Essence</p>
                <p>Automatique</p>

            </div>

            <p class="vehicle-description">
                Découvrez cette Audi Rs3,
                une berline sportive combinant performances,
                confort et élégance.
            </p>

            <a href="../contact.html" class="contact-btn">
                Nous contacter
            </a>

        </div>

    </main>


    <!-- Galerie plein écran -->

    <div class="photo-modal" id="photoModal">

        <button class="close-modal">&times;</button>

        <button class="prev-photo">&#10094;</button>

        <img id="modalImage" src="" alt="Photo Audi Rs3">

        <button class="next-photo">&#10095;</button>

    </div>


    <script src="../script.js"></script>

</body>

</html>
